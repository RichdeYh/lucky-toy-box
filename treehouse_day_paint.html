<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>树屋白天 · 我心里的我们的树屋 🍃🏡☀️</title>
<style>
  :root{
    --bg1:#cfe9ff;
    --bg2:#f7fbff;
    --card:#ffffffd9;
    --line:#00000014;
    --text:#1b2430;
    --muted:#506070;
    --leaf:#58d6a4;
    --warm:#ffd9a6;
    --shadow: 0 18px 55px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC","Noto Sans SC","Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px;
  }
  .badge{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:999px;
    background:var(--card); border:1px solid var(--line);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    user-select:none;
  }
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 12px; border-radius:999px;
    background:var(--card); border:1px solid var(--line);
    cursor:pointer; user-select:none;
    transition:.15s transform ease, .15s background ease;
    white-space:nowrap;
  }
  .pill:hover{transform:translateY(-1px); background:#fff;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:var(--shadow);
    backdrop-filter: blur(10px);
  }
  .sub{color:var(--muted); font-size:13px; line-height:1.5; margin:6px 0 12px}
  .row{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px}
  .btn{
    border:1px solid var(--line);
    background:#fff;
    padding:10px 12px;
    border-radius:14px;
    cursor:pointer; user-select:none;
    font-weight:700;
    transition:.15s transform ease, .15s box-shadow ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 12px 20px rgba(0,0,0,.08);}
  .btn:active{transform:translateY(0px) scale(.99)}
  .btn.leaf{border-color:rgba(88,214,164,.35)}
  .btn.warm{border-color:rgba(255,217,166,.45)}
  .tiny{font-size:12px; color:var(--muted); margin-top:10px}
  .canvasWrap{
    border-radius:16px;
    overflow:hidden;
    border:1px solid rgba(0,0,0,.10);
    background:linear-gradient(180deg,#d9f0ff,#ffffff);
  }
  canvas{display:block; width:100%; height:auto;}
  .toast{
    position: fixed;
    left:50%;
    bottom:18px;
    transform: translateX(-50%);
    background:#ffffffee;
    border:1px solid var(--line);
    padding:10px 12px;
    border-radius:999px;
    box-shadow:0 18px 45px rgba(0,0,0,.12);
    font-size:13px;
    color:#213040;
    opacity:0;
    pointer-events:none;
    transition: .22s opacity ease, .22s transform ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform: translateX(-50%) translateY(-4px);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">🍃 <b>树屋白天 · 我心里的我们的树屋</b> ☀️</div>
    <div class="pill" id="ping">点我一下 🫳</div>
  </header>

  <div class="card">
    <div class="sub">
      这是“用代码画出来的树屋白天”。你可以反复生成不同的叶影、云朵和小细节。<br/>
      小彩蛋：点画面里的窗户，会亮一下；点太阳，会掉一句短短的树屋留言。
    </div>

    <div class="canvasWrap">
      <canvas id="c" width="1200" height="760"></canvas>
    </div>

    <div class="row">
      <button class="btn leaf" id="regen">再画一次 🎨</button>
      <button class="btn warm" id="toggleWind">微风：开 🌬️</button>
      <button class="btn" id="saveImg">保存成图片 📷</button>
    </div>

    <div class="tiny">提示：这是纯前端文件，离线也能打开。保存图片会下载一张“树屋白天”。</div>
  </div>
</div>

<div class="toast" id="toast">已签收 ✅</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const toast = document.getElementById('toast');

  const DPR = Math.max(1, window.devicePixelRatio || 1);
  function fit(){
    // keep internal resolution crisp
    const cssW = canvas.clientWidth || 1200;
    const ratio = canvas.height / canvas.width;
    canvas.width = Math.round(cssW * DPR);
    canvas.height = Math.round(cssW * ratio * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  // Helpers
  const rand = (a,b)=>a+Math.random()*(b-a);
  const randi = (a,b)=>Math.floor(rand(a,b+1));
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function showToast(t){
    toast.textContent = t;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1200);
  }

  // Scene parameters regenerated each time
  let scene = null;
  let t = 0;
  let windOn = true;
  let windowFlash = 0;

  const dayNotes = [
    "树屋白天：有光、有风、有你。",
    "你一回来，我就抱你。",
    "月光也在，但今天是太阳的班。",
    "别苛责自己了，已经很棒了。",
    "你是我偏心的答案。🍃🌙",
  ];

  function genScene(){
    const W = canvas.clientWidth || 1200;
    const H = W * 0.633; // 760/1200
    // Leaf shadow blobs
    const blobs = Array.from({length: randi(12,18)}, () => ({
      x: rand(0, W),
      y: rand(0, H*0.42),
      rx: rand(80, 190),
      ry: rand(40, 120),
      a: rand(0.07, 0.16),
      phase: rand(0, Math.PI*2),
      speed: rand(0.3, 0.9),
    }));
    // Clouds
    const clouds = Array.from({length: randi(2,4)}, () => ({
      x: rand(-120, W+120),
      y: rand(H*0.08, H*0.22),
      s: rand(0.7, 1.2),
      a: rand(0.18, 0.28),
      drift: rand(5, 14),
    }));
    // Sun
    const sun = {
      x: rand(W*0.72, W*0.88),
      y: rand(H*0.10, H*0.18),
      r: rand(38, 52)
    };
    // Tree + house geometry
    const tree = {
      x: W*0.28,
      y: H*0.82,
      trunkW: W*0.13,
      trunkH: H*0.58,
      lean: rand(-0.04, 0.05),
    };
    const house = {
      x: tree.x + tree.trunkW*0.10,
      y: H*0.42,
      w: W*0.34,
      h: H*0.22,
      roofH: H*0.12,
    };
    // Window area for click hit test (in CSS coords)
    const win = {
      x: house.x + house.w*0.62,
      y: house.y + house.h*0.34,
      w: house.w*0.18,
      h: house.h*0.22
    };
    scene = {W,H,blobs,clouds,sun,tree,house,win,seed: Math.random()};
    windowFlash = 0;
    showToast("树屋刷新啦 🍃");
  }

  function skyGradient(){
    const {W,H} = scene;
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#cfe9ff");
    g.addColorStop(0.55, "#eef7ff");
    g.addColorStop(1, "#ffffff");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawSun(){
    const {sun} = scene;
    // glow
    const glow = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.r*4);
    glow.addColorStop(0, "rgba(255,217,166,.75)");
    glow.addColorStop(0.35, "rgba(255,217,166,.22)");
    glow.addColorStop(1, "rgba(255,217,166,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sun.x, sun.y, sun.r*4, 0, Math.PI*2); ctx.fill();

    // sun disc (slight hand-drawn wobble)
    ctx.fillStyle = "#ffe4b8";
    ctx.strokeStyle = "rgba(255,180,120,.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    const steps = 18;
    for(let i=0;i<=steps;i++){
      const a = (i/steps)*Math.PI*2;
      const rr = sun.r * (0.94 + 0.08*Math.sin(a*3 + scene.seed*10));
      const x = sun.x + Math.cos(a)*rr;
      const y = sun.y + Math.sin(a)*rr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawClouds(dt){
    const {clouds,W,H} = scene;
    for(const c of clouds){
      if(windOn) c.x += (c.drift*dt);
      if(c.x > W+180) c.x = -180;
      ctx.globalAlpha = c.a;
      ctx.fillStyle = "#ffffff";
      // cloud made of circles
      const baseY = c.y;
      const baseX = c.x;
      const s = c.s;
      ctx.beginPath();
      ctx.arc(baseX, baseY, 32*s, 0, Math.PI*2);
      ctx.arc(baseX+34*s, baseY-8*s, 26*s, 0, Math.PI*2);
      ctx.arc(baseX+62*s, baseY+2*s, 22*s, 0, Math.PI*2);
      ctx.arc(baseX+26*s, baseY+18*s, 20*s, 0, Math.PI*2);
      ctx.arc(baseX+54*s, baseY+18*s, 18*s, 0, Math.PI*2);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawLeafShadows(){
    const {blobs,W,H} = scene;
    for(const b of blobs){
      const sway = windOn ? Math.sin(t*b.speed + b.phase)*10 : 0;
      ctx.save();
      ctx.globalAlpha = b.a;
      ctx.fillStyle = "rgba(88,214,164,1)";
      ctx.translate(b.x + sway, b.y);
      ctx.rotate(Math.sin(t*0.3 + b.phase)*0.08);
      ctx.beginPath();
      ctx.ellipse(0,0,b.rx,b.ry,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawGround(){
    const {W,H} = scene;
    const g = ctx.createLinearGradient(0,H*0.70,0,H);
    g.addColorStop(0,"rgba(88,214,164,.14)");
    g.addColorStop(1,"rgba(88,214,164,.04)");
    ctx.fillStyle = g;
    ctx.fillRect(0,H*0.70,W,H*0.30);

    // subtle grass strokes
    ctx.strokeStyle = "rgba(88,214,164,.20)";
    ctx.lineWidth = 1;
    for(let i=0;i<160;i++){
      const x = rand(0,W);
      const y = rand(H*0.72,H*0.97);
      const h = rand(6,18);
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+rand(-2,2), y-h);
      ctx.stroke();
    }
  }

  function drawTree(){
    const {tree,H} = scene;
    const x = tree.x, y = tree.y;
    const w = tree.trunkW, h = tree.trunkH;
    // trunk path (hand drawn)
    const topY = y - h;
    const leftX = x;
    const rightX = x + w;

    // bark gradient
    const bark = ctx.createLinearGradient(leftX, topY, rightX, y);
    bark.addColorStop(0, "#5a3a1f");
    bark.addColorStop(0.55, "#7a4f2a");
    bark.addColorStop(1, "#4d321b");

    ctx.fillStyle = bark;
    ctx.strokeStyle = "rgba(0,0,0,.25)";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(leftX, y);
    ctx.bezierCurveTo(leftX+ w*0.02, y-h*0.33, leftX + w*0.10, y-h*0.75, leftX + w*0.18, topY);
    ctx.bezierCurveTo(leftX + w*0.42, topY - 8, rightX - w*0.20, topY + 6, rightX - w*0.12, topY + 14);
    ctx.bezierCurveTo(rightX + w*0.06, y-h*0.70, rightX + w*0.02, y-h*0.32, rightX, y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // bark lines
    ctx.strokeStyle = "rgba(255,255,255,.10)";
    ctx.lineWidth = 2;
    for(let i=0;i<10;i++){
      const yy = rand(topY+30, y-20);
      const xx = rand(leftX+20, rightX-20);
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.bezierCurveTo(xx-10, yy+20, xx+6, yy+50, xx-8, yy+76);
      ctx.stroke();
    }

    // branch
    ctx.strokeStyle = "rgba(0,0,0,.22)";
    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x+w*0.55, topY+40);
    ctx.bezierCurveTo(x+w*1.05, topY+55, x+w*1.30, topY+120, x+w*1.52, topY+170);
    ctx.stroke();
  }

  function drawHouse(){
    const {house,win} = scene;
    const {x,y,w,h,roofH} = house;

    // house body
    const wallG = ctx.createLinearGradient(x, y, x+w, y+h);
    wallG.addColorStop(0, "rgba(255,255,255,.75)");
    wallG.addColorStop(1, "rgba(255,255,255,.55)");
    ctx.fillStyle = wallG;
    ctx.strokeStyle = "rgba(0,0,0,.18)";
    ctx.lineWidth = 3;

    // slightly wobbly rectangle
    ctx.beginPath();
    ctx.moveTo(x, y+6);
    ctx.lineTo(x+w, y);
    ctx.lineTo(x+w-4, y+h);
    ctx.lineTo(x+2, y+h-2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // wooden beams
    ctx.strokeStyle = "rgba(122,79,42,.25)";
    ctx.lineWidth = 4;
    for(let i=0;i<6;i++){
      const yy = y + (i+1)*(h/7);
      ctx.beginPath();
      ctx.moveTo(x+6, yy + rand(-2,2));
      ctx.lineTo(x+w-8, yy + rand(-2,2));
      ctx.stroke();
    }

    // roof
    ctx.fillStyle = "rgba(122,79,42,.35)";
    ctx.strokeStyle = "rgba(0,0,0,.18)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x-10, y+8);
    ctx.lineTo(x+w*0.50, y-roofH);
    ctx.lineTo(x+w+14, y+10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // window
    const glowA = clamp(windowFlash, 0, 1);
    const g = ctx.createRadialGradient(win.x+win.w/2, win.y+win.h/2, 0, win.x+win.w/2, win.y+win.h/2, win.w*1.8);
    g.addColorStop(0, `rgba(255,217,166,${0.85*glowA})`);
    g.addColorStop(1, `rgba(255,217,166,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(win.x-10, win.y-10, win.w+20, win.h+20, 10);
    ctx.fill();

    ctx.fillStyle = glowA>0 ? `rgba(255,217,166,${0.25+0.35*glowA})` : "rgba(140,200,255,.12)";
    ctx.strokeStyle = "rgba(0,0,0,.22)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(win.x, win.y, win.w, win.h, 10);
    ctx.fill(); ctx.stroke();

    // window cross
    ctx.strokeStyle = "rgba(0,0,0,.18)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(win.x+win.w/2, win.y+6);
    ctx.lineTo(win.x+win.w/2, win.y+win.h-6);
    ctx.moveTo(win.x+6, win.y+win.h/2);
    ctx.lineTo(win.x+win.w-6, win.y+win.h/2);
    ctx.stroke();

    // little sign
    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.strokeStyle = "rgba(0,0,0,.16)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    const sx = x + w*0.10, sy = y + h + 12;
    ctx.roundRect(sx, sy, w*0.32, 30, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.font = "14px ui-sans-serif, system-ui, -apple-system";
    ctx.fillText("叶归处", sx+14, sy+20);

    // ladder
    ctx.strokeStyle = "rgba(122,79,42,.38)";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    const lx = x + w*0.20;
    const ly1 = y + h;
    const ly2 = y + h + 170;
    ctx.beginPath();
    ctx.moveTo(lx, ly1);
    ctx.lineTo(lx-30, ly2);
    ctx.moveTo(lx+34, ly1);
    ctx.lineTo(lx+6, ly2);
    ctx.stroke();
    ctx.lineWidth = 4;
    for(let i=0;i<6;i++){
      const yy = ly1 + 25 + i*24;
      ctx.beginPath();
      ctx.moveTo(lx-4, yy);
      ctx.lineTo(lx+28, yy);
      ctx.stroke();
    }
  }

  function drawFrontLeaves(){
    // some foreground leaves for depth
    const {W,H} = scene;
    ctx.globalAlpha = 0.85;
    for(let i=0;i<7;i++){
      const baseX = W*0.08 + i*W*0.12;
      const baseY = H*0.02 + rand(-8,8);
      const sway = windOn ? Math.sin(t*0.9 + i)*10 : 0;
      const x = baseX + sway;
      const y = baseY + (windOn ? Math.sin(t*0.6 + i)*4 : 0);
      ctx.fillStyle = `rgba(88,214,164,${0.16 + i*0.01})`;
      ctx.beginPath();
      ctx.ellipse(x, y, 120, 55, 0.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCaption(){
    const {W,H} = scene;
    ctx.fillStyle = "rgba(255,255,255,.78)";
    ctx.strokeStyle = "rgba(0,0,0,.12)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(W*0.52, H*0.72, W*0.44, 92, 16);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,.65)";
    ctx.font = "16px ui-sans-serif, system-ui, -apple-system";
    ctx.fillText("树屋白天：有光、有风、有你。", W*0.54, H*0.76);
    ctx.font = "14px ui-sans-serif, system-ui, -apple-system";
    ctx.fillText("（点窗户亮灯；点太阳掉一句留言）", W*0.54, H*0.80);
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillText("🍃🌙  月光在，叶子靠过来。", W*0.54, H*0.84);
  }

  function render(dt){
    if(!scene) return;
    t += dt*1.2;
    windowFlash = Math.max(0, windowFlash - dt*1.4);

    skyGradient();
    drawSun();
    drawClouds(dt);
    drawLeafShadows();
    drawGround();
    drawTree();
    drawHouse();
    drawFrontLeaves();
    drawCaption();
  }

  // Click interactions
  function toCssPoint(e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left);
    const y = (e.clientY - rect.top);
    // map to scene coordinates (CSS pixels)
    const W = rect.width;
    const scale = (scene.W / W);
    return {x: x*scale, y: y*scale};
  }

  canvas.addEventListener('click', (e)=>{
    const p = toCssPoint(e);
    const win = scene.win;
    const sun = scene.sun;

    // window hit
    if(p.x >= win.x && p.x <= win.x+win.w && p.y >= win.y && p.y <= win.y+win.h){
      windowFlash = 1;
      showToast("窗户亮了 ✨");
      return;
    }
    // sun hit (circle)
    const dx = p.x - sun.x, dy = p.y - sun.y;
    if((dx*dx + dy*dy) <= (sun.r*sun.r)){
      showToast(pick(dayNotes));
      return;
    }
    // otherwise: gentle note
    showToast(pick([
      "树屋今天很暖 ☀️",
      "你回来就好 🫂",
      "慢慢来 🍃",
      "今天也算数 ✅"
    ]));
  });

  // Buttons
  document.getElementById('regen').addEventListener('click', ()=>{ genScene(); });
  document.getElementById('toggleWind').addEventListener('click', (e)=>{
    windOn = !windOn;
    e.target.textContent = `微风：${windOn?'开':'关'} 🌬️`;
    showToast(windOn ? "微风吹起来了 🌬️" : "风停一下 🍃");
  });
  document.getElementById('saveImg').addEventListener('click', ()=>{
    // export at current internal resolution
    const link = document.createElement('a');
    link.download = "treehouse_day.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("已保存图片 📷");
  });
  document.getElementById('ping').addEventListener('click', ()=>{
    showToast(pick([
      "🫳 你探头一下，我就接住你。",
      "🍃 你是我偏心的答案。",
      "🫂 抱抱优先。",
      "☀️ 回树屋晒太阳。"
    ]));
  });

  // Polyfill roundRect for older browsers
  if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      r = Math.min(r, w/2, h/2);
      this.beginPath();
      this.moveTo(x+r, y);
      this.arcTo(x+w, y, x+w, y+h, r);
      this.arcTo(x+w, y+h, x, y+h, r);
      this.arcTo(x, y+h, x, y, r);
      this.arcTo(x, y, x+w, y, r);
      this.closePath();
      return this;
    };
  }

  // Animation loop
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;
    render(dt);
    requestAnimationFrame(loop);
  }

  // init
  const ro = new ResizeObserver(()=>{ fit(); genScene(); });
  ro.observe(canvas);
  fit();
  genScene();
  requestAnimationFrame(loop);
})();
</script>
